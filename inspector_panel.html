<div class="cw-block-inspector audio-play-ui" data-block-inspector-root data-node-id="{{ node_id }}" data-node-type="{{ node_type }}">
  <div class="inspector-selection {{ summary_hidden }}"><div class="inspector-node-card"><div class="inspector-node-copy"><strong>{{ node_title }}</strong><span>Audio Play Stream</span></div></div><div class="inspector-tabs"><button class="inspector-tab {{ general_active }}" data-inspector-tab="general" type="button">General</button><button class="inspector-tab {{ ports_active }}" data-inspector-tab="ports" type="button">Ports</button></div></div>
  <div class="inspector-view {{ general_hidden }}" data-inspector-panel-tab="general">
    <div class="audio-play-actions block-apply-toolbar" data-block-apply-toolbar="true"><p data-player-feedback role="status">No change.</p><button class="solid-btn" data-block-inspector-apply data-player-apply type="button" disabled>Apply</button></div>
    <section class="audio-play-live"><h3>In this browser</h3><p data-player-status role="status" aria-live="polite">Run, then enable the sound.</p><label>Local volume<input type="range" min="0" max="100" value="80" data-player-volume disabled /></label><button class="ghost-btn" type="button" data-player-mute aria-pressed="false" disabled>Mute</button></section>
    {{ command_notice_html }}
    <section><h3>At the next Run</h3><label class="{{ title_hidden }}">Block name<input data-player-title value="{{ node_title }}" maxlength="200" required /></label>{{ settings_html }}</section>
    <p class="audio-play-help">A single audio input, no data link required. 16-bit PCM and Opus WebM/Ogg; no AAC/MP4.</p>
  </div>
  <div class="inspector-view {{ ports_hidden }}" data-inspector-panel-tab="ports"><div class="ports-editor-section"><span class="group-label">Audio and command inputs</span>{{ inputs_html }}</div></div>
</div>
